name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        shell: pwsh
        run: ./tools/setup.ps1
      - name: Compile check
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m compileall -q captions tools main.py
      - name: Build portable package
        shell: pwsh
        run: ./tools/build.ps1

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android toolchain
        run: ./tools/setup-wsl.sh
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
