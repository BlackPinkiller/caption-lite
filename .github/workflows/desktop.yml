name: Desktop build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-lock.txt
      - name: Install dependencies
        run: ./tools/setup.ps1
      - name: Compile check
        run: ./.venv/Scripts/python.exe -m compileall -q captions tools main.py
      - name: Build portable package
        run: ./tools/build.ps1
